# Dataset(CCVID)
dataset:
  root: dataset
  train_txt: dataset/train.txt
  num_frames: 8
  sampling: uniform
  image_size: 256
  crop_size: 224

model:
  # Branch A: Clothed Body Stream
  # T frames => DINOv2 => T X 768 => Temporal Transformer => T X 768 => Linear + LN => T X 512
  vit_out_dim: 768
  temporal_heads: 8
  temporal_layers: 2
  temporal_dropout: 0.1
  branch_a_out_dim: 512
  use_branch_b: true

  # Branch B: Bare Body Stream
  # T frames => HMR2.0 => T X 226 => GRU => T X 226 => token encoder => T X 512
  hmr2_out_dim: 226
  gru_layers: 2
  branch_b_out_dim: 512

  # Fusion: Cross Attention
  # Q: T X 512 (Branch A) attends to K,V: T X 512 (Branch B)
  # residual + MLP => avg pool => LayerNorm => 512
  fusion_heads: 8
  fused_dim: 512

  # Task Heads
  num_classes: 75

# Smoke test
smoke:
  num_sequences: 8
  batch_size: 4
  device: cuda

# Training
train:
  device: cuda
  num_epochs: 60
  batch_size: 32
  num_workers: 4
  base_lr: 0.0001
  backbone_lr: 0.00001
  weight_decay: 0.01
  T_max: 30
  unfreeze_all_epoch: 31
  save_every: 5
  val_every: 5
  val_ratio: 0.2
  num_instances: 4
  triplet_margin: 0.3
  triplet_weight: 0.5
  experiment_name: branch_a_and_b_triplet

# Evaluation
evaluate:
  device: cuda
  batch_size: 32
  num_workers: 4
  gallery_subset: 0
  query_subset: 0
