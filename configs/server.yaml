# Dataset(CCVID)
dataset:
  root: dataset
  train_txt: dataset/train.txt
  num_frames: 8
  sampling: uniform
  image_size: 256
  crop_size: 224

model:
  # Branch A: Clothed Body Stream
  # T frames => Sapiens2 => T X 768 => TT => T X 768 => LP => T X 512
  vit_out_dim: 768
  temporal_heads: 8
  temporal_layers: 2
  temporal_dropout: 0.1
  branch_a_out_dim: 512
  use_branch_b: false

  # Branch B: Bare Body Stream
  # T frames => PARE/PyMAF/HMR2.0 => T X 2048 => GRU => 512 => regressor => 82 => token encoder => N X 512
  resnet_out_dim: 2048 # verify this after swapping to HMR2.0
  gru_hidden_dim: 512
  gru_layers: 2
  regressor_out_dim: 82
  smpl_num_tokens: 8
  branch_b_out_dim: 512

  # Fusion: Cross Attention
  # Q: T X 512 (Branch A) attends to K,V: N X 512 (Branch B)
  # Output: T X 512 => avg pool => 512 => Linear + LayerNorm => 512
  fusion_heads: 8
  fused_dim: 512

  # Task Heads
  num_classes: 75

# Smoke test
smoke:
  num_sequences: 8
  batch_size: 4
  device: cuda

# Training
train:
  device: cuda
  num_epochs: 10
  batch_size: 32
  num_workers: 4
  base_lr: 0.0001
  backbone_lr: 0.00001
  weight_decay: 0.01
  lr_step: 20
  lr_gamma: 0.1
  unfreeze_hmr_epoch: 4
  unfreeze_all_epoch: 7
  save_every: 5
  smoke_subset: 0
  val_subset: 150
  experiment_name: phase0_branch_a_only

# Evaluation
evaluate:
  device: cuda
  batch_size: 32
  num_workers: 4
  gallery_subset: 0
  query_subset: 0
